<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Robin Hood Runner</title>
<style>
  /* Basic page setup: dark forest-ish backdrop, centered canvas */
  html, body {
    margin: 0;
    padding: 0;
    background: #1b2b1b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameCanvas {
    background: #7ec850;
    border: 4px solid #3d2b1f;
    display: block;
  }
  #hint {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #eee;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="480" height="640"></canvas>
<div id="hint">Arrows: move / jump / slide &nbsp;|&nbsp; Space: shoot arrow &nbsp;|&nbsp; R: restart after game over</div>

<script>
/* =========================================================================
   ROBIN HOOD RUNNER
   A simple 3-lane endless runner built with plain canvas 2D drawing.
   No images, no libraries -- everything is drawn with basic shapes.
   ========================================================================= */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CANVAS_W = canvas.width;
const CANVAS_H = canvas.height;

// ---- Lane setup ----------------------------------------------------------
const LANE_COUNT = 3;
const LANE_WIDTH = CANVAS_W / LANE_COUNT;
function laneCenterX(lane) {
  return LANE_WIDTH * lane + LANE_WIDTH / 2;
}

// The player's fixed vertical position on screen (world scrolls past him).
const PLAYER_Y = CANVAS_H - 140;

// ---- Game state ------------------------------------------------------------
let state = {
  running: true,
  lane: 1,            // current lane index (0,1,2)
  targetX: laneCenterX(1),
  x: laneCenterX(1),
  // Jump/slide
  isJumping: false,
  jumpVel: 0,
  jumpY: 0,            // vertical offset (negative = up)
  isSliding: false,
  slideTimer: 0,
  // Scroll/speed
  speed: 6,
  baseSpeed: 6,
  distance: 0,
  gold: 0,
  // Obstacles/pickups/enemies/arrows
  obstacles: [],       // logs (jump) and branches (slide)
  guards: [],
  coins: [],
  arrows: [],
  // Timers
  spawnTimer: 0,
  spawnInterval: 70,   // frames between spawns, decreases with speed
  gameOverReason: '',
};

const GRAVITY = 0.9;
const JUMP_POWER = -15;
const SLIDE_DURATION = 30; // frames

// ---- Input ----------------------------------------------------------------
const keys = {};
window.addEventListener('keydown', (e) => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) {
    e.preventDefault();
  }
  if (!state.running) {
    if (e.key === 'r' || e.key === 'R') resetGame();
    return;
  }
  if (keys[e.key]) return; // ignore auto-repeat for one-shot actions
  keys[e.key] = true;

  if (e.key === 'ArrowLeft') {
    changeLane(-1);
  } else if (e.key === 'ArrowRight') {
    changeLane(1);
  } else if (e.key === 'ArrowUp') {
    startJump();
  } else if (e.key === 'ArrowDown') {
    startSlide();
  } else if (e.key === ' ') {
    shootArrow();
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

function changeLane(dir) {
  const newLane = Math.min(LANE_COUNT - 1, Math.max(0, state.lane + dir));
  state.lane = newLane;
  state.targetX = laneCenterX(newLane);
}

function startJump() {
  if (state.isJumping || state.isSliding) return;
  state.isJumping = true;
  state.jumpVel = JUMP_POWER;
}

function startSlide() {
  if (state.isJumping) return;
  state.isSliding = true;
  state.slideTimer = SLIDE_DURATION;
}

function shootArrow() {
  if (!state.running) return;
  state.arrows.push({
    x: state.x,
    y: PLAYER_Y - 20,
    lane: state.lane,
  });
}

// ---- Spawning ---------------------------------------------------------------
function spawnEntity() {
  const lane = Math.floor(Math.random() * LANE_COUNT);
  const roll = Math.random();

  if (roll < 0.32) {
    // Log obstacle -- must jump over
    state.obstacles.push({ type: 'log', lane, y: -40, w: LANE_WIDTH * 0.7, h: 22 });
  } else if (roll < 0.55) {
    // Branch obstacle -- must slide under
    state.obstacles.push({ type: 'branch', lane, y: -40, w: LANE_WIDTH * 0.7, h: 18 });
  } else if (roll < 0.8) {
    // Guard enemy -- shoot or avoid lane
    state.guards.push({ lane, y: -40, w: 34, h: 46, alive: true });
  } else {
    // Gold coin
    state.coins.push({ lane, y: -40, r: 10 });
  }
}

// ---- Update -------------------------------------------------------------
function update() {
  if (!state.running) return;

  // Speed ramps up slowly with distance for difficulty progression.
  state.speed = state.baseSpeed + state.distance / 800;
  state.distance += state.speed / 10;

  // Smooth lane movement (lerp toward target lane x-position).
  state.x += (state.targetX - state.x) * 0.25;

  // Jumping physics
  if (state.isJumping) {
    state.jumpY += state.jumpVel;
    state.jumpVel += GRAVITY;
    if (state.jumpY >= 0) {
      state.jumpY = 0;
      state.isJumping = false;
      state.jumpVel = 0;
    }
  }

  // Sliding timer
  if (state.isSliding) {
    state.slideTimer--;
    if (state.slideTimer <= 0) state.isSliding = false;
  }

  // Spawn new entities at an interval that shrinks as speed increases.
  state.spawnTimer++;
  const interval = Math.max(28, 70 - state.speed * 3);
  if (state.spawnTimer >= interval) {
    state.spawnTimer = 0;
    spawnEntity();
  }

  // Move obstacles/guards/coins/arrows down (obstacles) or up (arrows).
  for (const o of state.obstacles) o.y += state.speed;
  for (const g of state.guards) g.y += state.speed;
  for (const c of state.coins) c.y += state.speed;
  for (const a of state.arrows) a.y -= 14;

  // Remove off-screen entities
  state.obstacles = state.obstacles.filter(o => o.y < CANVAS_H + 50);
  state.guards = state.guards.filter(g => g.y < CANVAS_H + 50 && g.alive);
  state.coins = state.coins.filter(c => c.y < CANVAS_H + 50);
  state.arrows = state.arrows.filter(a => a.y > -20);

  // Arrow vs guard collisions
  for (const a of state.arrows) {
    for (const g of state.guards) {
      if (!g.alive) continue;
      if (a.lane === g.lane && Math.abs(a.y - g.y) < 30) {
        g.alive = false;
        a.y = -9999; // mark arrow used
      }
    }
  }
  state.arrows = state.arrows.filter(a => a.y > -20);
  state.guards = state.guards.filter(g => g.alive);

  // Coin collection
  state.coins = state.coins.filter(c => {
    if (c.lane === state.lane && Math.abs(c.y - PLAYER_Y) < 30) {
      state.gold++;
      return false;
    }
    return true;
  });

  // Collision with obstacles (logs need jump, branches need slide)
  for (const o of state.obstacles) {
    if (o.lane !== state.lane) continue;
    if (Math.abs(o.y - PLAYER_Y) < 26) {
      if (o.type === 'log' && !(state.isJumping && state.jumpY < -20)) {
        return gameOver('Hit a log! Jump over it next time.');
      }
      if (o.type === 'branch' && !state.isSliding) {
        return gameOver('Hit a branch! Slide under it next time.');
      }
    }
  }

  // Collision with guards (any contact in same lane = game over)
  for (const g of state.guards) {
    if (g.lane === state.lane && Math.abs(g.y - PLAYER_Y) < 30) {
      return gameOver('Caught by a guard!');
    }
  }
}

function gameOver(reason) {
  state.running = false;
  state.gameOverReason = reason;
}

function resetGame() {
  state = {
    running: true,
    lane: 1,
    targetX: laneCenterX(1),
    x: laneCenterX(1),
    isJumping: false,
    jumpVel: 0,
    jumpY: 0,
    isSliding: false,
    slideTimer: 0,
    speed: 6,
    baseSpeed: 6,
    distance: 0,
    gold: 0,
    obstacles: [],
    guards: [],
    coins: [],
    arrows: [],
    spawnTimer: 0,
    spawnInterval: 70,
    gameOverReason: '',
  };
}

// ---- Drawing --------------------------------------------------------------
function drawBackground() {
  // Sky/grass gradient forest floor
  ctx.fillStyle = '#7ec850';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Lane divider lines
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 3;
  ctx.setLineDash([16, 14]);
  for (let i = 1; i < LANE_COUNT; i++) {
    ctx.beginPath();
    ctx.moveTo(LANE_WIDTH * i, 0);
    ctx.lineTo(LANE_WIDTH * i, CANVAS_H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Simple forest trees along the edges for atmosphere
  drawTreeRow();
}

let treeScroll = 0;
function drawTreeRow() {
  treeScroll = (treeScroll + state.speed) % 90;
  ctx.fillStyle = '#2f5c2f';
  for (let y = -90 + treeScroll; y < CANVAS_H; y += 90) {
    // left side trees
    drawTree(18, y);
    drawTree(CANVAS_W - 18, y + 45);
  }
}

function drawTree(x, y) {
  ctx.fillStyle = '#5b3a21';
  ctx.fillRect(x - 4, y, 8, 20);
  ctx.fillStyle = '#2f5c2f';
  ctx.beginPath();
  ctx.moveTo(x, y - 25);
  ctx.lineTo(x - 16, y + 5);
  ctx.lineTo(x + 16, y + 5);
  ctx.closePath();
  ctx.fill();
}

function drawPlayer() {
  const x = state.x;
  let y = PLAYER_Y + state.jumpY;
  const slide = state.isSliding;

  ctx.save();
  ctx.translate(x, y);

  if (slide) {
    // Sliding pose: squashed body
    ctx.fillStyle = '#2e7d32'; // green hood/tunic
    ctx.fillRect(-18, -14, 36, 22);
    ctx.fillStyle = '#c68642'; // face
    ctx.beginPath();
    ctx.arc(14, -6, 8, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Body (tunic)
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(-14, -30, 28, 34);

    // Hood (pointed)
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath();
    ctx.moveTo(-14, -30);
    ctx.lineTo(0, -46);
    ctx.lineTo(14, -30);
    ctx.closePath();
    ctx.fill();

    // Face
    ctx.fillStyle = '#c68642';
    ctx.beginPath();
    ctx.arc(0, -30, 9, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    ctx.fillStyle = '#4e342e';
    ctx.fillRect(-12, 4, 9, 14);
    ctx.fillRect(3, 4, 9, 14);

    // Bow (simple arc on the side)
    ctx.strokeStyle = '#6d4c1c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(16, -14, 14, -Math.PI / 2.2, Math.PI / 2.2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawObstacles() {
  for (const o of state.obstacles) {
    const x = laneCenterX(o.lane);
    if (o.type === 'log') {
      ctx.fillStyle = '#6d4c1c';
      ctx.fillRect(x - o.w / 2, o.y - o.h / 2, o.w, o.h);
      // wood grain rings on ends
      ctx.fillStyle = '#8d6e3c';
      ctx.beginPath();
      ctx.ellipse(x - o.w / 2, o.y, 5, o.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + o.w / 2, o.y, 5, o.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // branch: drawn higher up (must slide under it) with a dashed look
      ctx.fillStyle = '#4e342e';
      ctx.fillRect(x - o.w / 2, o.y - o.h / 2 - 18, o.w, o.h);
      ctx.fillStyle = '#6d8f4e';
      for (let i = -o.w / 2; i < o.w / 2; i += 12) {
        ctx.beginPath();
        ctx.arc(x + i, o.y - 18, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawGuards() {
  for (const g of state.guards) {
    const x = laneCenterX(g.lane);
    const y = g.y;
    ctx.fillStyle = '#9e9e9e';
    ctx.fillRect(x - g.w / 2, y - g.h / 2, g.w, g.h);
    // helmet
    ctx.fillStyle = '#616161';
    ctx.fillRect(x - g.w / 2 - 2, y - g.h / 2 - 8, g.w + 4, 10);
    // face slit
    ctx.fillStyle = '#333';
    ctx.fillRect(x - 6, y - g.h / 2 + 2, 12, 4);
  }
}

function drawCoins() {
  for (const c of state.coins) {
    const x = laneCenterX(c.lane);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#c9a400';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawArrows() {
  ctx.strokeStyle = '#3e2723';
  ctx.lineWidth = 3;
  for (const a of state.arrows) {
    const x = laneCenterX(a.lane);
    ctx.beginPath();
    ctx.moveTo(x, a.y + 10);
    ctx.lineTo(x, a.y - 10);
    ctx.stroke();
    // arrowhead
    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.moveTo(x, a.y - 14);
    ctx.lineTo(x - 4, a.y - 8);
    ctx.lineTo(x + 4, a.y - 8);
    ctx.closePath();
    ctx.fill();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, CANVAS_W, 40);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Courier New';
  ctx.textBaseline = 'middle';
  ctx.fillText('Distance: ' + Math.floor(state.distance) + 'm', 12, 20);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('Gold: ' + state.gold, CANVAS_W - 12, 20);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';

  ctx.font = 'bold 30px Courier New';
  ctx.fillText('GAME OVER', CANVAS_W / 2, CANVAS_H / 2 - 60);

  ctx.font = '16px Courier New';
  ctx.fillText(state.gameOverReason, CANVAS_W / 2, CANVAS_H / 2 - 25);

  ctx.font = 'bold 18px Courier New';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('Distance: ' + Math.floor(state.distance) + 'm   Gold: ' + state.gold, CANVAS_W / 2, CANVAS_H / 2 + 15);

  ctx.fillStyle = '#fff';
  ctx.font = '16px Courier New';
  ctx.fillText('Press R to restart', CANVAS_W / 2, CANVAS_H / 2 + 55);

  ctx.textAlign = 'left';
}

function draw() {
  drawBackground();
  drawObstacles();
  drawGuards();
  drawCoins();
  drawArrows();
  drawPlayer();
  drawHUD();

  if (!state.running) {
    drawGameOver();
  }
}

// ---- Main loop --------------------------------------------------------------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
